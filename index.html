<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raihana & Fahmie | 13 Mac 2027</title>

  <!-- ===== FAVICON ===== -->
  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- ===== WHATSAPP / SOCIAL LINK PREVIEW (Open Graph) ===== -->
  <meta property="og:title" content="Raihana & Fahmie | Wedding Invitation" />
  <meta property="og:description" content="Dengan penuh kesyukuran, kami menjemput anda ke majlis perkahwinan kami. 13 Mac 2027." />
  <meta property="og:image" content="assets/preview.jpg" />
  <meta property="og:url" content="https://pippomie.github.io/test1/" />
  <meta property="og:type" content="website" />

  <!-- ===== FONTS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Music button floating bottom-right -->
  <button id="musicBtn" class="music-btn" aria-label="Play music">🎵</button>
  <audio id="bgMusic" loop preload="auto">
    <source src="" type="audio/mpeg" />
  </audio>

  <!-- ===== HERO ===== -->
  <section class="hero">
    <div class="hero-content">
      <p class="script-label">The Wedding Of</p>
      <h1 class="couple-names">
        <span id="groomName"></span>
        <span class="amp">&</span>
        <span id="brideName"></span>
      </h1>
      <p class="hashtag" id="hashtag"></p>
      <p class="date-display" id="dateDisplay"></p>
      <button class="btn script-btn" id="musicPrompt">tekan untuk mainkan lagu</button>
    </div>
  </section>

  <!-- ===== INVITATION TEXT ===== -->
  <section class="section invitation">
    <p class="assalam">Assalamualaikum & Salam Sejahtera</p>
    <p id="invitationText"></p>
    <p class="poem" id="poem"></p>
  </section>

  <!-- ===== COUNTDOWN + ADD TO CALENDAR ===== -->
  <section class="section countdown-section">
    <h2>Menghitung Hari</h2>
    <div class="countdown" id="countdown">
      <div><span id="days">0</span><small>hari</small></div>
      <div><span id="hours">0</span><small>jam</small></div>
      <div><span id="minutes">0</span><small>minit</small></div>
      <div><span id="seconds">0</span><small>saat</small></div>
    </div>
    <button class="btn" id="addToCalendar">📅 Add to Calendar</button>
  </section>

  <!-- ===== VENUE ===== -->
  <section class="section venue-section">
    <h2>Lokasi</h2>
    <p class="venue-name" id="venueName"></p>
    <p class="venue-address" id="venueAddress"></p>
    <div class="map-wrapper">
      <iframe id="mapEmbed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    <div class="btn-row">
      <a class="btn" id="gmapsBtn" target="_blank" rel="noopener">Google Maps</a>
      <a class="btn" id="wazeBtn" target="_blank" rel="noopener">Waze</a>
    </div>
  </section>

  <!-- ===== SCHEDULE ===== -->
  <section class="section schedule-section">
    <h2>Atur Cara Majlis</h2>
    <ul class="schedule" id="scheduleList"></ul>
  </section>

  <!-- ===== CONTACTS (WhatsApp) ===== -->
  <section class="section contacts-section">
    <h2>Hubungi</h2>
    <div id="contactsList" class="contacts"></div>
  </section>

  <!-- ===== RSVP ===== -->
  <section class="section rsvp-section">
    <h2>RSVP</h2>
    <p>Sila sahkan kehadiran anda agar majlis dapat kami sempurnakan sebaiknya.</p>
    <iframe id="rsvpForm" loading="lazy"></iframe>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p id="footerHashtag"></p>
    <p class="small">Made with love 💐</p>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
